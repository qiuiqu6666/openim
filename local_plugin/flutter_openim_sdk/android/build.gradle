group = "io.openim.flutter_openim_sdk"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.3")
    }
}

def patchedCoreRepository = new File(projectDir, "../../../native_sdk/patch15/artifacts/maven")
def coreBuildRoot = new File(projectDir, "../../../native_sdk/patch15")
def coreManifest = new groovy.json.JsonSlurper().parse(new File(coreBuildRoot, "manifest.json"))

rootProject.allprojects {
    repositories {
        exclusiveContent {
            forRepository {
                maven {
                    name = "OpenIMPatchedCore"
                    url = patchedCoreRepository.toURI()
                }
            }
            filter { includeModule("io.openim", "core-sdk") }
        }
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

def verifyOpenIMCore = tasks.register("verifyOpenIMCore", Exec) {
    workingDir coreBuildRoot
    def python = System.getenv("CORE_PYTHON") ?: (System.getProperty("os.name").toLowerCase().contains("windows") ? "python" : "python3")
    commandLine python, new File(coreBuildRoot, "prepare_source.py").absolutePath, "--check-artifact", "android"
}
tasks.named("preBuild").configure { dependsOn verifyOpenIMCore }

android {
    namespace = "io.openim.flutter_openim_sdk"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    defaultConfig {
        minSdk = 21
    }

    dependencies {
        api "${coreManifest.android.coordinate}@aar"
        testImplementation("junit:junit:4.13.2")
        testImplementation("org.json:json:20180813")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
