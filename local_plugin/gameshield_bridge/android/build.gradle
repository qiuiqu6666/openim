import groovy.json.JsonSlurper
import java.security.MessageDigest

group = 'io.openim.gameshield'
version = '0.1.0'
buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:8.7.3' }
}
apply plugin: 'com.android.library'

def sdkFile = file('../vendor/android/GameShieldSDK.aar')
if (sdkFile.exists()) {
    def receiptFile = file('../vendor/android/compatibility.json')
    if (!receiptFile.exists()) {
        throw new GradleException('GameShield requires a compatibility receipt. Run tool/gameshield/check_sdk.py before staging the SDK.')
    }
    def receipt = new JsonSlurper().parse(receiptFile)
    def digest = MessageDigest.getInstance('SHA-256').digest(sdkFile.bytes).encodeHex().toString()
    if (receipt.schema != 1 || receipt.platform != 'android' || receipt.compatible != true ||
        receipt.files?.get('GameShieldSDK.aar') != digest) {
        throw new GradleException('GameShield SDK changed or failed compatibility checks. Recheck and stage a compatible SDK.')
    }
}
android {
    namespace = 'io.openim.gameshield'
    compileSdk = 35
    defaultConfig { minSdk = 24; consumerProguardFiles 'consumer-rules.pro' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { if (sdkFile.exists()) implementation files(sdkFile) }
