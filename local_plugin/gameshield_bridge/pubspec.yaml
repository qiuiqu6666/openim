name: gameshield_bridge
description: Optional Android and iOS GameShield native bridge for OpenIM.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: io.openim.gameshield
        pluginClass: GameShieldBridgePlugin
      ios:
        pluginClass: GameShieldBridgePlugin
