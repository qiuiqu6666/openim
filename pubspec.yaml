    path: openim_common
  openim_live:
    path: openim_live
  provider: 6.1.5+1
  webview_flutter: 4.13.1

dependency_overrides:
  # livekit_client 2.5.0+hotfix.3 requires WebRTC-SDK 137.7151.03 on iOS.
  # flutter_webrtc 1.2.x requires 137.7151.04, which CocoaPods cannot combine.
  flutter_webrtc: 1.1.0
  uri_to_file:
    path: local_plugin/uri_to_file

dev_dependencies:
  # Location picker boundary/interaction fixtures use the same coordinate type.
  latlong2: ^0.9.1
  # Exercise the existing local recorder's native lifecycle and custom surface.
  voice_note_kit:
    path: local_plugin/voice_note_kit
  # Independent 99chat composer rendering fixture; already used by common.
  extended_text_field: ^16.0.0
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.2.19
  hive_generator: ^2.0.1
  build_runner: 2.4.13
  flutter_lints: ^6.0.0
  webview_flutter_platform_interface: ^2.15.1
  video_player_platform_interface: ^6.6.0
  just_audio_platform_interface: ^4.6.0
# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # App-owned 99chat parity assets, including live artwork/tutorial and lottery balls.
  assets:
    - assets/images/
    - assets/ai/
    - assets/img/
    - assets/wallet.png
    - lib/pages/chat/messages/selection/assets/
    - lib/pages/chat/stickers/builtin/assets/4351/
    - lib/pages/official_account/assets/
    - lib/pages/contacts/create_group/assets/
    - lib/pages/conversation/empty/assets/
    - lib/pages/wallet/record/assets/
    - lib/pages/wallet/widgets/assets/
    - lib/pages/splash/assets/
    - lib/pages/group_features/mark_six/assets/
    - shorebird.yaml

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

