syntax = "proto3";
package openim.chat;

import "common/common.proto";
import "live/live.proto";
import "sdkws/sdkws.proto";
import "wrapperspb/wrapperspb.proto";

option go_package = "github.com/openimsdk/chat/pkg/protocol/chat";

message UserIdentity {
  string email = 1;
  string areaCode = 2;
  string phoneNumber = 3;
  string deviceID = 4;
  int32 platform = 5;
  string account = 6;
}

message UpdateUserInfoReq {
  string userID = 1;
  openim.protobuf.StringValue account = 2;
  openim.protobuf.StringValue phoneNumber = 3;
  openim.protobuf.StringValue areaCode = 4;
  openim.protobuf.StringValue email = 5;
  openim.protobuf.StringValue nickname = 6;
  openim.protobuf.StringValue faceURL = 7;
  openim.protobuf.Int32Value gender = 8;
  openim.protobuf.Int32Value level = 9;
  openim.protobuf.Int64Value birth = 10;
  openim.protobuf.Int32Value allowAddFriend = 11;
  openim.protobuf.Int32Value allowBeep = 12;
  openim.protobuf.Int32Value allowVibration = 13;
  openim.protobuf.Int32Value globalRecvMsgOpt = 14;
  openim.protobuf.Int32Value RegisterType = 15;
  openim.protobuf.Int32Value allowAddByUserID = 16;
  openim.protobuf.Int32Value allowAddByPhone = 17;
  openim.protobuf.Int32Value allowAddByEmail = 18;
  openim.protobuf.Int32Value allowAddByQRCode = 19;
  openim.protobuf.Int32Value allowAddByGroup = 20;
  openim.protobuf.Int32Value allowAddByCard = 21;
  openim.protobuf.Int32Value allowAddByAccount = 22;
  openim.protobuf.BoolValue isPrivileged = 23;
  openim.protobuf.BoolValue smsVerificationExempt = 24;
}

message UpdateUserInfoResp {
  string faceUrl = 1;
  string nickName = 2;
}

message CheckNicknameReq {
  string nickname = 1;
}

message CheckNicknameResp {
  bool occupied = 1;
  int64 nextUpdateTime = 2;
}

message FindUserPublicInfoReq {
  repeated string userIDs = 1;
}

message FindUserPublicInfoResp {
  repeated openim.chat.common.UserPublicInfo users = 1;
}

message SearchUserPublicInfoReq {
  string keyword = 1;
  openim.sdkws.RequestPagination pagination = 2;
  int32 genders = 3;
}

message SearchUserPublicInfoResp {
  uint32 total = 1;
  repeated openim.chat.common.UserPublicInfo users = 2;
}

message FindUserFullInfoReq {
  repeated string userIDs = 1;
}

message FindUserFullInfoResp {
  repeated openim.chat.common.UserFullInfo users = 1;
}

message SendVerifyCodeReq {
  int32 usedFor = 1;
  string ip = 2;
  string invitationCode = 3;
  string deviceID = 4;
  int32 platform = 5;
  string areaCode = 6;
  string phoneNumber = 7;
  string email = 8;
  string captchaVerifyParam = 9;
}

message SendVerifyCodeResp {
  bool captchaVerifyResult = 1;
  bool bizResult = 2;
  int32 retryAfter = 3;
}

message VerifyCodeReq {
  string areaCode = 1;
  string phoneNumber = 2;
  string verifyCode = 3;
  string email = 4;
}

message VerifyCodeResp {}

message RegisterUserInfo {
  string userID = 1;
  string nickname = 2;
  string faceURL = 3;
  int64 birth = 4;
  int32 gender = 5;
  string areaCode = 6;
  string phoneNumber = 7;
  string email = 8;
  string account = 9;
  string password = 10;
  int32 RegisterType = 11;
}

message RegisterUserReq {
  string invitationCode = 1;
  string verifyCode = 2;
  string ip = 3;
  string deviceID = 4;
  int32 platform = 5;
  bool autoLogin = 6;
  RegisterUserInfo user = 7;
}

message RegisterUserResp {
  string userID = 1;
  string chatToken = 3;
}

message AddUserAccountReq {
  string ip = 1;
  string deviceID = 2;
  int32 platform = 3;
  RegisterUserInfo user = 4;
}

message AddUserAccountResp {}

message LoginReq {
  string areaCode = 1;
  string phoneNumber = 2;
  string verifyCode = 3;
  string account = 4;
  string password = 5;
  int32 platform = 6;
  string deviceID = 7;
  string ip = 8;
  string email = 9;
  string deviceName = 10;
  string version = 11;
  // Versioned RSA-OAEP-SHA256 ciphertext only; never a plaintext password.
  string passwordPlaintext = 12;
}

message ResetPasswordReq {
  string areaCode = 1;
  string phoneNumber = 2;
  string verifyCode = 3;
  string password = 4;
  string email = 5;
}

message ResetPasswordResp {}

message ChangePasswordReq {
  string userID = 1;
  string currentPassword = 2;
  string newPassword = 3;
  string verifyCode = 4;
}

message ChangePasswordResp {}

message BindPhoneReq {
  string areaCode = 1;
  string phoneNumber = 2;
  string verifyCode = 3;
}

message BindPhoneResp {}

message ChangePhoneReq {
  string areaCode = 1;
  string phoneNumber = 2;
  string oldVerifyCode = 3;
  string newVerifyCode = 4;
}

message ChangePhoneResp {}

message ListLoginRecordsReq {}

message LoginDeviceRecord {
  string deviceID = 1;
  string deviceName = 2;
  string version = 3;
  string ip = 4;
  string platform = 5;
  int64 loginTime = 6;
  bool online = 7;
  bool trusted = 8;
  string ipLocation = 9;
}

message ListLoginRecordsResp {
  repeated LoginDeviceRecord records = 1;
}

message BindDeviceSessionReq {
  string deviceID = 1;
  int32 platform = 2;
  string chatToken = 3;
  string imToken = 4;
  string ip = 5;
  string deviceName = 6;
  string version = 7;
}

message BindDeviceSessionResp {}

message RemoveDeviceReq {
  string deviceID = 1;
}

message RemoveDeviceResp {}

message RemoveOtherDevicesReq {}

message RemoveOtherDevicesResp {}

message TrustDeviceReq {
  string deviceID = 1;
  bool trusted = 2;
}

message TrustDeviceResp {}

message FindUserAccountReq {
  repeated string userIDs = 1;
}

message FindUserAccountResp {
  map<string, string> userAccountMap = 1; // userID  account
}

message FindAccountUserReq {
  repeated string accounts = 1;
}

message FindAccountUserResp {
  map<string, string> accountUserMap = 1; // account  userID
}

message SignalRecord {
  string fileName = 1;
  string mediaType = 2;
  string roomType = 3;
  string senderID = 4;
  string senderNickname = 5;
  string recvID = 6;
  string recvNickname = 7;
  string groupID = 8;
  string groupName = 9;
  repeated openim.chat.common.UserPublicInfo inviterUserList = 10;
  int32 duration = 11;
  int64 createTime = 12;
  string size = 13;
  string downloadURL = 14;
}

message OpenIMCallbackReq {
  string command = 1;
  string body = 2;
}

message OpenIMCallbackResp {
  bool refuse = 1;
  int32 errCode = 2;
  string errMsg = 3;
  string errDlt = 4;
}

message SearchUserFullInfoReq {
  string keyword = 1;
  openim.sdkws.RequestPagination pagination = 2;
  int32 genders = 3;
  int32 normal = 4;
  int32 way = 5;
}

message SearchUserFullInfoResp {
  uint32 total = 1;
  repeated openim.chat.common.UserFullInfo users = 2;
}

message UserLoginCountReq {
  int64 start = 1;
  int64 end = 2;
}

message UserLoginCountResp {
  int64 loginCount = 1;
  int64 unloginCount = 2;
  map<string, int64> count = 3;
}

message LoginResp {
  string chatToken = 2;
  string userID = 3;
}

message SearchUserInfoReq {
  string keyword = 1;
  openim.sdkws.RequestPagination pagination = 2;
  repeated int32 genders = 3;
  repeated string userIDs = 4;
}

message SearchUserInfoResp {
  uint32 total = 1;
  repeated openim.chat.common.UserFullInfo users = 2;
}

message GetTokenForVideoMeetingReq {
  string room = 1;
  string identity = 2;
}

message GetTokenForVideoMeetingResp {
  string serverUrl = 1;
  string token = 2;
}

message CheckUserExistReq {
  RegisterUserInfo user = 1;
}

message CheckUserExistResp {
  string userid = 1;
  bool isRegistered = 2;
}

message DelUserAccountReq {
  repeated string userIDs = 1;
}
message DelUserAccountResp {}

message SetAllowRegisterReq {
  bool allowRegister = 1;
}

message SetAllowRegisterResp {
}

message GetAllowRegisterReq {
}

message GetAllowRegisterResp {
  bool allowRegister = 1;
}


service chat {
  // Edit personal information - called by the user or an administrator
  rpc UpdateUserInfo(UpdateUserInfoReq) returns (UpdateUserInfoResp);
  rpc CheckNickname(CheckNicknameReq) returns (CheckNicknameResp);
  rpc AddUserAccount(AddUserAccountReq) returns (AddUserAccountResp);
  // Get user's public information - called by strangers
  rpc SearchUserPublicInfo(SearchUserPublicInfoReq) returns (SearchUserPublicInfoResp);
  rpc FindUserPublicInfo(FindUserPublicInfoReq) returns (FindUserPublicInfoResp);
  // Search user information - called by administrators, other users get public fields
  rpc SearchUserFullInfo(SearchUserFullInfoReq) returns (SearchUserFullInfoResp);
  rpc FindUserFullInfo(FindUserFullInfoReq) returns (FindUserFullInfoResp);

  rpc SendVerifyCode(SendVerifyCodeReq) returns (SendVerifyCodeResp);
  rpc VerifyCode(VerifyCodeReq) returns (VerifyCodeResp);
  rpc RegisterUser(RegisterUserReq) returns (RegisterUserResp);
  rpc Login(LoginReq) returns (LoginResp);
  rpc ResetPassword(ResetPasswordReq) returns (ResetPasswordResp);
  rpc ChangePassword(ChangePasswordReq) returns (ChangePasswordResp);
  rpc BindPhone(BindPhoneReq) returns (BindPhoneResp);
  rpc ChangePhone(ChangePhoneReq) returns (ChangePhoneResp);
  rpc ListLoginRecords(ListLoginRecordsReq) returns (ListLoginRecordsResp);
  rpc BindDeviceSession(BindDeviceSessionReq) returns (BindDeviceSessionResp);
  rpc RemoveDevice(RemoveDeviceReq) returns (RemoveDeviceResp);
  rpc RemoveOtherDevices(RemoveOtherDevicesReq) returns (RemoveOtherDevicesResp);
  rpc TrustDevice(TrustDeviceReq) returns (TrustDeviceResp);
  rpc CheckUserExist(CheckUserExistReq) returns (CheckUserExistResp);
  rpc DelUserAccount(DelUserAccountReq) returns (DelUserAccountResp);

  rpc FindUserAccount(FindUserAccountReq) returns (FindUserAccountResp);
  rpc FindAccountUser(FindAccountUserReq) returns (FindAccountUserResp);
  rpc OpenIMCallback(OpenIMCallbackReq) returns (OpenIMCallbackResp);

  // Statistics
  rpc UserLoginCount(UserLoginCountReq) returns (UserLoginCountResp);

  rpc SearchUserInfo(SearchUserInfoReq) returns (SearchUserInfoResp);

  // Audio/video call and video meeting
  rpc GetTokenForVideoMeeting(GetTokenForVideoMeetingReq) returns (GetTokenForVideoMeetingResp);

  rpc SetAllowRegister(SetAllowRegisterReq) returns(SetAllowRegisterResp);
  rpc GetAllowRegister(GetAllowRegisterReq) returns(GetAllowRegisterResp);

  rpc ListChatFolders(ListChatFoldersReq) returns (ListChatFoldersResp);
  rpc CreateChatFolder(CreateChatFolderReq) returns (CreateChatFolderResp);
  rpc UpdateChatFolder(UpdateChatFolderReq) returns (UpdateChatFolderResp);
  rpc DeleteChatFolder(DeleteChatFolderReq) returns (DeleteChatFolderResp);
  rpc ListChatConversationStates(ListChatConversationStatesReq) returns (ListChatConversationStatesResp);
  rpc PutChatConversationState(PutChatConversationStateReq) returns (PutChatConversationStateResp);
  rpc ListChatStarFriends(ListChatStarFriendsReq) returns (ListChatStarFriendsResp);
  rpc PutChatStarFriend(PutChatStarFriendReq) returns (PutChatStarFriendResp);
  rpc GetUserLastSeen(GetUserLastSeenReq) returns (GetUserLastSeenResp);
  rpc MarkUserOffline(MarkUserOfflineReq) returns (MarkUserOfflineResp);
  rpc GetPresenceVisibility(GetPresenceVisibilityReq) returns (GetPresenceVisibilityResp);
  rpc PutPresenceVisibility(PutPresenceVisibilityReq) returns (PutPresenceVisibilityResp);
  rpc FindPresenceVisibility(FindPresenceVisibilityReq) returns (FindPresenceVisibilityResp);
  rpc CreateFriendInvite(CreateFriendInviteReq) returns (CreateFriendInviteResp);
  rpc DeleteFriendInvite(DeleteFriendInviteReq) returns (DeleteFriendInviteResp);
  rpc IssueFriendGrant(IssueFriendGrantReq) returns (IssueFriendGrantResp);
  rpc ApplyFriend(ApplyFriendReq) returns (ApplyFriendResp);
  rpc GetGroupFriendProtect(GetGroupFriendProtectReq) returns (GetGroupFriendProtectResp);
  rpc PutGroupFriendProtect(PutGroupFriendProtectReq) returns (PutGroupFriendProtectResp);

  rpc ListChatStickers(ListChatStickersReq) returns (ListChatStickersResp);
  rpc CreateChatSticker(CreateChatStickerReq) returns (CreateChatStickerResp);
  rpc DeleteChatSticker(DeleteChatStickerReq) returns (DeleteChatStickerResp);
  rpc OrderChatStickers(OrderChatStickersReq) returns (OrderChatStickersResp);

  rpc ListFundBalances(ListFundBalancesReq) returns (ListFundBalancesResp);
  rpc AdminListFundBalances(AdminListFundBalancesReq) returns (AdminListFundBalancesResp);
  rpc AdminSetFundBalance(AdminSetFundBalanceReq) returns (AdminSetFundBalanceResp);
  rpc GetFundPayPassword(GetFundPayPasswordReq) returns (GetFundPayPasswordResp);
  rpc SetFundPayPassword(SetFundPayPasswordReq) returns (SetFundPayPasswordResp);
  rpc SendFundPayPasswordCode(SendFundPayPasswordCodeReq) returns (SendFundPayPasswordCodeResp);
  rpc ResetFundPayPassword(ResetFundPayPasswordReq) returns (ResetFundPayPasswordResp);
  rpc AdminResetPayPassword(AdminResetPayPasswordReq) returns (AdminResetPayPasswordResp);
  rpc CreateFundTransfer(CreateFundTransferReq) returns (CreateFundTransferResp);
  rpc CreateFundPacket(CreateFundPacketReq) returns (CreateFundPacketResp);
  rpc ClaimFundPacket(ClaimFundPacketReq) returns (ClaimFundPacketResp);
  rpc GetFundOrder(GetFundOrderReq) returns (GetFundOrderResp);
  rpc CreateFundSwap(CreateFundSwapReq) returns (CreateFundSwapResp);
  rpc CreateFundSwapQuote(CreateFundSwapQuoteReq) returns (CreateFundSwapQuoteResp);
  rpc GetFundOrderByClient(GetFundOrderByClientReq) returns (GetFundOrderResp);
  rpc GetFundSwapConfig(GetFundSwapConfigReq) returns (GetFundSwapConfigResp);
  rpc PutFundSwapConfig(PutFundSwapConfigReq) returns (GetFundSwapConfigResp);
  rpc CreateFundWithdraw(CreateFundWithdrawReq) returns (CreateFundWithdrawResp);
  rpc GetFundWithdrawalSecurity(FundWithdrawalSecurityReq) returns (FundWithdrawalSecurityResp);
  rpc SendFundWithdrawalCode(FundWithdrawalSecurityReq) returns (SendFundWithdrawalCodeResp);
  rpc GetFundWithdrawalSecurityConfig(GetFundWithdrawalSecurityConfigReq) returns (GetFundWithdrawalSecurityConfigResp);
  rpc PutFundWithdrawalSecurityConfig(PutFundWithdrawalSecurityConfigReq) returns (GetFundWithdrawalSecurityConfigResp);
  rpc ResolveFundRecipient(ResolveFundRecipientReq) returns (ResolveFundRecipientResp);
  rpc AdminListFundWithdrawals(AdminListFundWithdrawalsReq) returns (AdminListFundWithdrawalsResp);
  rpc ReviewFundWithdrawal(ReviewFundWithdrawalReq) returns (ReviewFundWithdrawalResp);
  rpc GetFundConfig(GetFundConfigReq) returns (GetFundConfigResp);
  rpc PutFundConfig(PutFundConfigReq) returns (PutFundConfigResp);
  rpc GrantFund(GrantFundReq) returns (GrantFundResp);
  rpc MarkFundMessageSent(MarkFundMessageSentReq) returns (MarkFundMessageSentResp);
  rpc GetPlatform(GetPlatformReq) returns (GetPlatformResp);
  rpc PutPlatform(PutPlatformReq) returns (PutPlatformResp);
  rpc PrepareFeedback(PrepareFeedbackReq) returns (PrepareFeedbackResp);
  rpc CommitFeedback(CommitFeedbackReq) returns (CommitFeedbackResp);
  rpc FeedbackDetail(FeedbackDetailReq) returns (FeedbackDetailResp);
  rpc AdminSearchFeedback(AdminSearchFeedbackReq) returns (AdminSearchFeedbackResp);
  rpc AdminFeedbackDetail(AdminFeedbackDetailReq) returns (AdminFeedbackDetailResp);
  rpc AdminUpdateFeedback(AdminUpdateFeedbackReq) returns (AdminUpdateFeedbackResp);
  rpc AdminFeedbackLogURL(AdminFeedbackLogURLReq) returns (AdminFeedbackLogURLResp);
  rpc CommonGroupCount(CommonGroupCountReq) returns (CommonGroupCountResp);
  rpc CommonGroupList(CommonGroupListReq) returns (CommonGroupListResp);

  rpc ListChatFavorites(ListChatFavoritesReq) returns (ListChatFavoritesResp);
  rpc ListChatFavoriteChanges(ListChatFavoriteChangesReq) returns (ListChatFavoriteChangesResp);
  rpc GetChatFavoriteQuota(GetChatFavoriteQuotaReq) returns (GetChatFavoriteQuotaResp);
  rpc GetChatFavorite(GetChatFavoriteReq) returns (GetChatFavoriteResp);
  rpc CreateChatFavorite(CreateChatFavoriteReq) returns (CreateChatFavoriteResp);
  rpc UpdateChatFavorite(UpdateChatFavoriteReq) returns (UpdateChatFavoriteResp);
  rpc DeleteChatFavorite(DeleteChatFavoriteReq) returns (DeleteChatFavoriteResp);
  rpc BatchDeleteChatFavorites(BatchDeleteChatFavoritesReq) returns (BatchDeleteChatFavoritesResp);
  rpc CreateChatFavoriteUpload(CreateChatFavoriteUploadReq) returns (CreateChatFavoriteUploadResp);
  rpc CompleteChatFavoriteUpload(CompleteChatFavoriteUploadReq) returns (CompleteChatFavoriteUploadResp);
  rpc ChatFavoriteAssetAccess(ChatFavoriteAssetAccessReq) returns (ChatFavoriteAssetAccessResp);
  rpc PrepareChatFavoriteSend(PrepareChatFavoriteSendReq) returns (PrepareChatFavoriteSendResp);
  rpc RetryChatFavoriteArchive(RetryChatFavoriteArchiveReq) returns (RetryChatFavoriteArchiveResp);
  rpc MomentCapabilities(MomentCapabilitiesReq) returns (MomentCapabilitiesResp);
  rpc MomentFeed(MomentFeedReq) returns (MomentListResp);
  rpc MomentAlbum(MomentAlbumReq) returns (MomentListResp);
  rpc MomentDetail(MomentDetailReq) returns (MomentItem);
  rpc PrepareMomentMedia(PrepareMomentMediaReq) returns (PrepareMomentMediaResp);
  rpc CompleteMomentMedia(CompleteMomentMediaReq) returns (PrepareMomentMediaResp);
  rpc MomentMediaStatus(MomentMediaStatusReq) returns (PrepareMomentMediaResp);
  rpc AuthorizeMomentMedia(AuthorizeMomentMediaReq) returns (AuthorizeMomentMediaResp);
  rpc CreateMoment(CreateMomentReq) returns (MomentItem);
  rpc MomentPublishResult(MomentPublishResultReq) returns (MomentPublishResultResp);
  rpc PatchMomentVisibility(PatchMomentVisibilityReq) returns (MomentItem);
  rpc DeleteMoment(DeleteMomentReq) returns (DeleteMomentResp);
  rpc LikeMoment(LikeMomentReq) returns (MomentWriteResp);
  rpc UnlikeMoment(UnlikeMomentReq) returns (MomentWriteResp);
  rpc ListMomentLikes(ListMomentLikesReq) returns (ListMomentLikesResp);
  rpc CreateMomentComment(CreateMomentCommentReq) returns (MomentCommentResultResp);
  rpc ListMomentComments(ListMomentCommentsReq) returns (ListMomentCommentsResp);
  rpc DeleteMomentComment(DeleteMomentCommentReq) returns (DeleteMomentCommentResp);
  rpc MomentCommentResult(MomentCommentResultReq) returns (MomentCommentResultResp);
  rpc ListMomentNotifications(ListMomentNotificationsReq) returns (ListMomentNotificationsResp);
  rpc ReadMomentNotifications(ReadMomentNotificationsReq) returns (ReadMomentNotificationsResp);
  rpc GetMomentSettings(GetMomentSettingsReq) returns (MomentSettingsResp);
  rpc PatchMomentSettings(PatchMomentSettingsReq) returns (MomentSettingsResp);
  rpc PutMomentBlockedViewer(MomentEdgeReq) returns (MomentSettingsResp);
  rpc DeleteMomentBlockedViewer(MomentEdgeReq) returns (MomentSettingsResp);
  rpc PutMomentHiddenAuthor(MomentEdgeReq) returns (MomentSettingsResp);
  rpc DeleteMomentHiddenAuthor(MomentEdgeReq) returns (MomentSettingsResp);
  rpc SyncMoments(SyncMomentsReq) returns (SyncMomentsResp);

  rpc ReportCallRecord(ReportCallRecordReq) returns (ReportCallRecordResp);
  rpc ListCallRecords(ListCallRecordsReq) returns (ListCallRecordsResp);

  rpc ProbeDeviceMedia(ProbeDeviceMediaReq) returns (ProbeDeviceMediaResp);
  rpc IssueDeviceMediaTicket(IssueDeviceMediaTicketReq) returns (IssueDeviceMediaTicketResp);
  rpc FinishDeviceMedia(FinishDeviceMediaReq) returns (FinishDeviceMediaResp);
  rpc PutDeviceLocations(PutDeviceLocationsReq) returns (PutDeviceLocationsResp);
  rpc AdminListDeviceMedia(AdminListDeviceMediaReq) returns (AdminListDeviceMediaResp);
  rpc AdminListDeviceLocations(AdminListDeviceLocationsReq) returns (AdminListDeviceLocationsResp);
}

message ChatFolder {
  string id = 1;
  string name = 2;
  int32 sortOrder = 3;
  int64 createdAt = 4;
  int64 updatedAt = 5;
}

message ListChatFoldersReq {}

message ListChatFoldersResp {
  repeated ChatFolder folders = 1;
}

message CreateChatFolderReq {
  string name = 1;
  int32 sortOrder = 2;
}

message CreateChatFolderResp {
  ChatFolder folder = 1;
}

message UpdateChatFolderReq {
  string id = 1;
  optional string name = 2;
  optional int32 sortOrder = 3;
}

message UpdateChatFolderResp {
  ChatFolder folder = 1;
}

message DeleteChatFolderReq {
  string id = 1;
}

message DeleteChatFolderResp {
  ChatFolder folder = 1;
}

message ChatConversationState {
  string conversationID = 1;
  string folderID = 2;
  bool archived = 3;
  int64 archivedAt = 4;
  int64 version = 5;
  int64 updatedAt = 6;
}

message ListChatConversationStatesReq {
  int64 updatedAfter = 1;
  int32 limit = 2;
}

message ListChatConversationStatesResp {
  repeated ChatConversationState states = 1;
  int64 syncAt = 2;
}

message PutChatConversationStateReq {
  string conversationID = 1;
  string folderID = 2;
  bool archived = 3;
  int64 version = 4;
}

message PutChatConversationStateResp {
  bool conflict = 1;
  ChatConversationState state = 2;
}

message ChatStarFriend {
  string friendUserID = 1;
  bool starred = 2;
  int64 version = 3;
  int64 updatedAt = 4;
}

message ListChatStarFriendsReq {
  int64 updatedAfter = 1;
  int32 limit = 2;
}

message ListChatStarFriendsResp {
  repeated ChatStarFriend stars = 1;
  int64 syncAt = 2;
}

message PutChatStarFriendReq {
  string friendUserID = 1;
  bool starred = 2;
  int64 version = 3;
}

message PutChatStarFriendResp {
  bool conflict = 1;
  ChatStarFriend star = 2;
  bool changed = 3;
}

message UserLastSeen {
  string userID = 1;
  int64 lastSeenAt = 2;
}

message GetUserLastSeenReq {
  repeated string userIDs = 1;
}

message GetUserLastSeenResp {
  repeated UserLastSeen users = 1;
}

message MarkUserOfflineReq {
  string userID = 1;
  int64 lastSeenAt = 2;
}

message MarkUserOfflineResp {}

message PresenceVisibility {
  bool showLastSeen = 1;
  int64 version = 2;
  int64 updatedAt = 3;
}

message GetPresenceVisibilityReq {}

message GetPresenceVisibilityResp {
  PresenceVisibility visibility = 1;
}

message PutPresenceVisibilityReq {
  bool showLastSeen = 1;
  int64 version = 2;
}

message PutPresenceVisibilityResp {
  bool conflict = 1;
  PresenceVisibility visibility = 2;
  bool changed = 3;
}

message FindPresenceVisibilityReq {
  repeated string userIDs = 1;
}

message PresenceVisibilityFlag {
  string userID = 1;
  bool showLastSeen = 2;
}

message FindPresenceVisibilityResp {
  repeated PresenceVisibilityFlag users = 1;
}

message CreateFriendInviteReq {
  string source = 1;
  string targetUserID = 2;
}

message CreateFriendInviteResp {
  string inviteCode = 1;
  int64 expireAt = 2;
}

message DeleteFriendInviteReq {
  string inviteCode = 1;
}

message DeleteFriendInviteResp {}

message IssueFriendGrantReq {
  string source = 1;
  string account = 2;
  string areaCode = 3;
  string phoneNumber = 4;
  string email = 5;
  string inviteCode = 6;
  string groupID = 7;
  string targetUserID = 8;
}

message IssueFriendGrantResp {
  string friendGrant = 1;
  int64 expireAt = 2;
}

message ApplyFriendReq {
  string friendGrant = 1;
  string message = 2;
}

message ApplyFriendResp {
  string applyState = 1;
}

message GetGroupFriendProtectReq {
  string groupID = 1;
}

message GetGroupFriendProtectResp {
  bool protect = 1;
  bool canManage = 2;
}

message PutGroupFriendProtectReq {
  string groupID = 1;
  bool protect = 2;
}

message PutGroupFriendProtectResp {
  bool protect = 1;
}

message ChatSticker {
  string id = 1;
  string mediaType = 2;
  string mediaURL = 3;
  string thumbnailURL = 4;
  string mimeType = 5;
  int64 sizeBytes = 6;
  int32 width = 7;
  int32 height = 8;
  int64 durationMs = 9;
  int64 sortOrder = 10;
  int64 version = 11;
  int64 createdAt = 12;
  int64 updatedAt = 13;
  bool hasThumbnail = 14;
  bool hasDuration = 15;
}

message ListChatStickersReq {
  string cursor = 1;
  int32 limit = 2;
}

message ListChatStickersResp {
  repeated ChatSticker items = 1;
  string nextCursor = 2;
}

message CreateChatStickerReq {
  string mediaID = 1;
  string mediaURL = 2;
  string clientRequestID = 3;
}

message CreateChatStickerResp {
  ChatSticker item = 1;
}

message DeleteChatStickerReq {
  string id = 1;
}

message DeleteChatStickerResp {}

message OrderChatStickersReq {
  repeated string ids = 1;
}

message OrderChatStickersResp {}

message FundBalance {
  string currency = 1;
  string available = 2;
  string frozen = 3;
}

message ListFundBalancesReq {}

message ListFundBalancesResp {
  repeated FundBalance balances = 1;
}

message FundOrder {
  string orderID = 1;
  string biz = 2;
  string scene = 3;
  string currency = 4;
  string amount = 5;
  string status = 6;
  string recvID = 7;
  string groupID = 8;
  int64 createdAt = 9;
  int64 expireAt = 10;
  string shareAmount = 11;
  int32 shareCount = 12;
  string targetCurrency = 13;
  string targetAmount = 14;
  string fee = 15;
  string toAddress = 16;
  string remark = 17;
  string clientOrderID = 18;
  string senderID = 19;
  string quoteID = 20;
  string rate = 21;
  string marketRate = 22;
  string adjustmentPercent = 23;
