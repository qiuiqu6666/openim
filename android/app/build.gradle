plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
    id 'com.google.gms.google-services'
}

def amapLocalProperties = new Properties()
def amapLocalFile = rootProject.file('amap.properties')
if (amapLocalFile.exists()) {
    amapLocalFile.withInputStream { amapLocalProperties.load(it) }
}
def amapAndroidKey = (project.findProperty('AMAP_ANDROID_KEY')
        ?: System.getenv('AMAP_ANDROID_KEY')
        ?: amapLocalProperties.getProperty('AMAP_ANDROID_KEY')
        ?: '').toString().trim()
def localSigningProperties = new Properties()
def localSigningFile = rootProject.file('key.properties')
if (localSigningFile.exists()) {
    localSigningFile.withInputStream { localSigningProperties.load(it) }
}

android {
    namespace "io.openim"
    compileSdk 35
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions { 
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId "chat.chat99.chatpro"
        minSdkVersion flutter.minSdkVersion
        targetSdk 33
        versionCode flutter.versionCode
        versionName flutter.versionName
        multiDexEnabled true
        manifestPlaceholders += [AMAP_ANDROID_KEY: amapAndroidKey]

        // Flutter configures ABI splits itself. Keeping a second fixed filter
        // conflicts with --split-per-abi and needlessly builds other targets.
        if (!(project.findProperty('split-per-abi') ?: 'false').toString().toBoolean()) {
            def requestedPlatforms = (project.findProperty('target-platform') ?: 'android-arm64,android-x64').toString().split(',')
            def platformAbis = ['android-arm': 'armeabi-v7a', 'android-arm64': 'arm64-v8a', 'android-x64': 'x86_64']
            ndk { abiFilters(*requestedPlatforms.collect { platformAbis[it] }.findAll { it != null }) }
        }
    }

    signingConfigs {
        release {
            if (localSigningFile.exists()) {
                keyAlias localSigningProperties.getProperty('keyAlias')
                keyPassword localSigningProperties.getProperty('keyPassword')
                storeFile rootProject.file(localSigningProperties.getProperty('storeFile'))
                storePassword localSigningProperties.getProperty('storePassword')
            } else {
                keyAlias 'openim'
                keyPassword 'openim'
                storeFile file('./openim')
                storePassword 'openim'
            }
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.release }
        profile { signingConfig signingConfigs.release }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }


    lint {
        disable 'InvalidPackage'
        disable "Instantiatable"
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.amap.api:3dmap-location-search:11.3.100_loc11.3.000_sea9.8.1'

    // Firebase
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.firebase:firebase-messaging"

}

static def buildTime() {
    return new Date().format("MMddHHmm", TimeZone.getTimeZone("GMT+08:00"))
}
