flutter_native_splash:
  # Native launch resources are maintained alongside the Flutter splash page.
  # Do not regenerate all platforms: the existing NormalTheme system bars and
  # native integrations must be preserved.
  background_image: "lib/pages/splash/assets/splash_99chat.webp"
  background_image_dark: "lib/pages/splash/assets/splash_99chat.webp"
  background_image_android: "android/app/src/main/res/drawable-nodpi/splash_99chat.png"
  background_image_dark_android: "android/app/src/main/res/drawable-nodpi/splash_99chat.png"
  background_image_ios: "ios/Runner/Assets.xcassets/LaunchBackground.imageset/splash_99chat.png"
  background_image_dark_ios: "ios/Runner/Assets.xcassets/LaunchBackground.imageset/splash_99chat.png"
  android_gravity: fill
  ios_content_mode: scaleAspectFill
  fullscreen: false
  android: true
  ios: true
  web: false

  # Android 12+ supports a solid background and a masked icon, not a full image.
  # Keep this system phase unobtrusive until the Flutter splash draws its image.
  android_12:
    color: "#1E90FF"
    color_dark: "#1E90FF"
    image: "lib/pages/splash/assets/android12_transparent.png"
    image_dark: "lib/pages/splash/assets/android12_transparent.png"
    icon_background_color: "#1E90FF"
    icon_background_color_dark: "#1E90FF"
